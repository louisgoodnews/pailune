name: Bug report
description: Something in Pailune does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the troubleshooting section of `docs/user-guide.md` first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I enabled X, pressed Apply, and …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import …
        2. Enable …
        3. Press Apply
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Mods involved
      description: Names and Nexus links of the mods, if any.
  - type: input
    id: version
    attributes:
      label: Pailune version
      placeholder: "0.1.0 (AppImage / built from source at commit …)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (desktop)
        - Linux (Steam Deck)
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution / OS version and Proton version
      placeholder: "Arch, Proton 10 / Windows 11 …"
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: From the Log tab or Settings → Advanced → Open log folder. Remove anything private.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
