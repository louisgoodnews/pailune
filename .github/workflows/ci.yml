name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # Tests marked #[ignore] need a local game installation or network access.
        run: cargo test

  portability:
    # Windows and macOS are goals (B-08). The build must pass; tests are
    # informative until deployment without symlinks exists (decision D-11).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Test
        continue-on-error: true
        run: cargo test
      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Pailune-${{ matrix.os }}
          path: |
            target/release/pailune.exe
            target/release/pailune

  appimage:
    # Release builds only. Ubuntu 22.04 keeps the glibc floor at 2.35, so the
    # AppImage runs on most current distributions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          # No FUSE on the runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pailune-AppImage
          path: target/appimage/*.AppImage
