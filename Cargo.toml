[package]
name = "pylune"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Linux mod manager for Crimson Desert (Steam / Proton)"

[dependencies]
chacha20 = "0.10"
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
lz4_flex = "0.11"
md-5 = "0.11.0"
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unrar = "0.5.8"
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"
zip = "9.1.0"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
